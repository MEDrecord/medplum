# HealthTalk Agent Configuration
# This configuration extends the base @mrd/agents definitions

extends: "@mrd/agents"

brand: healthtalk
name: "HealthTalk"
description: "Intelligent healthcare communication platform"

# Specs - Technical specifications
specs:
  - specs/architecture.mdx           # Core architecture overview
  - specs/gateway-integration.mdx    # Gateway auth and fetch patterns
  - specs/medplum-integration.mdx    # Medplum FHIR integration
  - specs/multi-tenant.mdx           # Multi-brand and multi-tenant config (consolidated)
  - specs/template-system.mdx        # AI rapport templates
  - specs/questionnaire-builder.mdx  # ROM/Scorelijsten (FHIR Questionnaire)
  - specs/design-system.mdx          # UI components and theming
  - specs/brand-style-guide.mdx      # HealthTalk visual identity
  - specs/notification-gateway.mdx   # Notification channels (WhatsApp, SMS, Email, Voice, Teams)

# Instincts - Coding guidelines and patterns
instincts:
  - instincts/coding.mdx             # Coding best practices

# Patterns - Reusable code patterns
patterns:
  - patterns/gateway.mdx             # Gateway API route patterns

# Skills - Domain-specific capabilities
skills:
  - skills/fhir.mdx                  # FHIR operations and Medplum skills

# Brand-specific overrides
overrides:
  instincts: []
  patterns: []
  skills: []
  specs: []
  standards: []

# Brand-specific additions
additions:
  skills:
    - patient-communication
    - appointment-scheduling
    - care-team-messaging

# Disabled base agents (if any)
disabled: []

# Environment-specific settings
settings:
  medplum_project: "healthtalk-prod"
  gateway_url: "https://auth-test-b2c.healthtalk.ai"
  default_locale: "nl-NL"

# Non-negotiable rules
rules:
  - Frontend → API Route → Gateway → Database. Always.
  - No direct DB access from client code.
  - All backend ops run server-side only.
  - Every request verified with auth.id from gateway.
  - UI uses shadcn/ui + React Flow only.
  - No custom CSS, no inline styles.
  - Do not assume. If ambiguous, STOP and ask.

# Feature flags
features:
  voice_agent: true
  questionnaires: true
  templates: true
  combined_reports: true
  loinc_import: true

# Supported brands in this platform
supported_brands:
  - healthtalk
  - coachi
  - medsafe
  - medrecord
